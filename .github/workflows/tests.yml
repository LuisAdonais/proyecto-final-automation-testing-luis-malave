# GitHub Actions — ejecuta la suite completa en cada push/PR a main.
# La API key de ReqRes se configura en GitHub Secrets (REQRES_API_KEY).

name: Automation Testing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar secret de ReqRes
        run: |
          if [ -z "${{ secrets.REQRES_API_KEY }}" ]; then
            echo "ERROR: Falta configurar REQRES_API_KEY en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Ejecutar pruebas
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: pytest

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-automation-testing
          path: |
            reports/
            screenshots/
